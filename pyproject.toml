[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-transfer-lab"
version = "1.0.0"
description = "Reproducible ARQ protocol simulator for UDP reliability experiments"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.32", "matplotlib>=3.8", "pandas>=2.1"]

[project.scripts]
rtl = "reliable_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
